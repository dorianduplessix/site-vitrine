[build]
  command = "node scripts/build-realisations.mjs"
  publish = "dist"

[[redirects]]
  from = "/installations-sanitaires"
  to = "/services/renovation-salle-deau"
  status = 301
  force = true

[[redirects]]
  from = "/enduit-peinture"
  to = "/services/enduit-peinture-placo"
  status = 301
  force = true

[[redirects]]
  from = "/salle-de-bain"
  to = "/services/renovation-salle-deau"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
